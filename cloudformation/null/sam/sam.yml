AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31


Resources:
  #=========================================================================
  # S3 RESOURCES
  #=========================================================================
  SurveyBucket:
    Type: AWS::S3::Bucket
    DependsOn: 
      - S3EventQueue
      - S3ToSQSQueuePolicy
    Properties:
      BucketName: !Sub "reinvent-survey-data-2023-${AWS::AccountId}"
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt S3EventQueue.Arn



  S3BucketDeleteLambdaFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - UnifiedLambdaExecutionRole
    Properties:
      FunctionName: !Sub "DeleteS3Bucket-${AWS::AccountId}"
      Handler: s3_delete.lambda_handler
      Role: !GetAtt UnifiedLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 50
      CodeUri: ./lambda_function/



  #=========================================================================
  # SQS RESOURCES
  #=========================================================================
  S3EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "s3-event-queue-${AWS::AccountId}"

  S3ToSQSQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    DependsOn: S3EventQueue
    Properties:
      Queues:
        - !Ref S3EventQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3ToSendMessage
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: "SQS:SendMessage"
            Resource: !GetAtt S3EventQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::reinvent-survey-data-2023-${AWS::AccountId}"

  #=========================================================================
  # IAM ROLES
  #=========================================================================
  UnifiedLambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${AWS::AccountId}-unified-lambda-role'
      Description: Comprehensive execution role for all Lambda functions in the application
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - 'lambda.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSLambda_FullAccess'
        - 'arn:aws:iam::aws:policy/CloudWatchLogsFullAccess'
        - 'arn:aws:iam::aws:policy/AWSLambdaExecute'
        - 'arn:aws:iam::aws:policy/AmazonS3FullAccess'
        - 'arn:aws:iam::aws:policy/AmazonKinesisFullAccess'
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/AWSXrayFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonOpenSearchServiceFullAccess'
        - 'arn:aws:iam::aws:policy/SecretsManagerReadWrite'
        - 'arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess'
      Policies:
        - PolicyName: 'LambdaInvokePolicy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action: 'lambda:InvokeFunction'
                Resource: '*'

  FirehoseBankRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${AWS::AccountId}-firehose2-opensearch-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - firehose.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/CloudWatchLogsFullAccess"
        - "arn:aws:iam::aws:policy/AmazonS3FullAccess"
        - "arn:aws:iam::aws:policy/AWSLambda_FullAccess"
        - "arn:aws:iam::aws:policy/AmazonOpenSearchServiceFullAccess"

  PipesExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${AWS::AccountId}-unified-pipes-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service:
                - pipes.amazonaws.com
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonSQSFullAccess"
        - "arn:aws:iam::aws:policy/AmazonKinesisFirehoseFullAccess"
        - "arn:aws:iam::aws:policy/CloudWatchFullAccess"
        - "arn:aws:iam::aws:policy/AmazonS3FullAccess"
        - "arn:aws:iam::aws:policy/AmazonKinesisFullAccess"

  CognitioLambdaRoleNew:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cognito_access_${AWS::AccountId}-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: MyLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - cognito-identity:*
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/CloudWatchFullAccess

  OpensearchGUIAccess:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "opensearch_gui-${AWS::AccountId}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - es.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonOpenSearchServiceCognitoAccess

  AuthUserRole:
    Type: 'AWS::IAM::Role'
    DependsOn: 
      - CognitoIdentityPool
      - UnifiedLambdaExecutionRole
    Properties:
      RoleName: !Sub "ops-cognito-${AWS::AccountId}-Role"
      Path: "/"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref CognitoIdentityPool
              'ForAnyValue:StringLike':
                'cognito-identity.amazonaws.com:amr': authenticated
          - Effect: Allow
            Principal:
              Service: 
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
          - Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:aws:iam::${AWS::AccountId}:role/${AWS::AccountId}-unified-lambda-role"
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: 'ops-lambdaExecution'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'mobileanalytics:PutEvents'
                  - 'cognito-sync:*'
                  - 'cognito-identity:*'
                Resource:
                  - '*'
        - PolicyName: 'OpenSearchAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'es:ESHttpPut'
                  - 'es:ESHttpPost'
                  - 'es:ESHttpGet'
                  - 'es:ESHttpDelete'
                Resource: 
                  - '*'

  PassThroughPolicy:
    Type: AWS::IAM::Policy
    DependsOn: AuthUserRole
    Properties:
      PolicyName: !Sub "opensearch-cognito-pass-throughPolicy-${AWS::AccountId}"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - iam:PassRole
              - es:*
            Resource: "*"
      Roles:
        - !Ref AuthUserRole

  #=========================================================================
  # CLOUDWATCH LOGS
  #=========================================================================
  StepFunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/states/${AWS::AccountId}-StepFunctions"
      RetentionInDays: 14

  StepFunctionsLogStream:
    Type: "AWS::Logs::LogStream"
    DependsOn: StepFunctionsLogGroup
    Properties:
      LogGroupName: !Ref StepFunctionsLogGroup
      LogStreamName: !Sub "StepFunctionsLogStream"

  SurveyFirehoseLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: !Sub "survey-firehose-group"

  SurveyFirehoseLogStream:
    Type: "AWS::Logs::LogStream"
    DependsOn: SurveyFirehoseLogGroup
    Properties:
      LogGroupName: !Ref SurveyFirehoseLogGroup
      LogStreamName: !Sub "survey-firehose-stream"

  SurveyFirehoseLogS3Group:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: !Sub "survey-firehose-s3-group"

  SurveyFirehoseLogS3Stream:
    Type: "AWS::Logs::LogStream"
    DependsOn: SurveyFirehoseLogS3Group
    Properties:
      LogGroupName: !Ref SurveyFirehoseLogS3Group
      LogStreamName: !Sub "survey-firehose-s3-stream"

  #=========================================================================
  # COGNITO RESOURCES
  #=========================================================================
  CognitoUserPoolNew:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "Opensearch-UserPool-${AWS::AccountId}"

  CognitoDomain:
    Type: AWS::Cognito::UserPoolDomain
    DependsOn: CognitoUserPoolNew
    Properties:
      Domain: !Sub "user-pool-${AWS::AccountId}"
      UserPoolId: !Ref CognitoUserPoolNew

  CognitoIdentityPool:
    Type: 'AWS::Cognito::IdentityPool'
    Properties:
      IdentityPoolName: !Sub "CognitoIdentityPool-${AWS::AccountId}"
      AllowUnauthenticatedIdentities: true

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    DependsOn: 
      - CognitoIdentityPool
      - AuthUserRole
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt AuthUserRole.Arn

  #=========================================================================
  # OPENSEARCH RESOURCES
  #=========================================================================
  OpenSearchCluster:
    Type: AWS::OpenSearchService::Domain
    DependsOn: 
      - OpensearchGUIAccess
      - CognitoIdentityPool
      - CognitoUserPoolNew
      - AuthUserRole
    Properties:
      CognitoOptions:
        Enabled: true
        IdentityPoolId: !Ref CognitoIdentityPool
        RoleArn: !GetAtt OpensearchGUIAccess.Arn
        UserPoolId: !Ref CognitoUserPoolNew
      DomainName: opensearch-cluster
      EngineVersion: OpenSearch_2.17
      ClusterConfig:
        InstanceType: r7g.xlarge.search
        InstanceCount: 2
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: true
        ZoneAwarenessConfig:
          AvailabilityZoneCount: 2
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 100
        VolumeType: gp3
      SnapshotOptions:
        AutomatedSnapshotStartHour: 0
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: false
        MasterUserOptions:
          MasterUserARN: !GetAtt AuthUserRole.Arn
      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      AdvancedOptions:
        rest.action.multi.allow_explicit_index: 'true'
      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt AuthUserRole.Arn
            Action: es:*
            Resource: "*"
      DomainEndpointOptions:
        EnforceHTTPS: true

  #=========================================================================
  # LAMBDA LAYERS
  #=========================================================================
  OpensearchPyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: opensearch-py
      Description: OpenSearch Python client library
      ContentUri: ../lambda_layers/opensearch_py
      CompatibleRuntimes:
        - python3.11
        - python3.12
    Metadata:
      BuildMethod: python3.12  # This tells SAM to build the layer using pip

  RequestsAws4AuthLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: requests-aws4auth
      Description: AWS4Auth library for signed requests
      ContentUri: ../lambda_layers/requests_aws4auth
      CompatibleRuntimes:
        - python3.11
        - python3.12
    Metadata:
      BuildMethod: python3.12  # This tells SAM to build the layer using pip

  #=========================================================================
  # STEP FUNCTIONS & ASSOCIATED RESOURCES
  #=========================================================================
  StateMachineExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: !Sub "${AWS::AccountId}-StateMachineExecutionRole"
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: states.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - "arn:aws:iam::aws:policy/CloudWatchLogsFullAccess"
        Policies:
          - PolicyName: "StateMachineLambdaInvokePolicy"
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource:
                    - !GetAtt OpensearchIndexLambdaFunction.Arn
                    - !GetAtt CognitioUserCreateLambdaLayerFunctionNew.Arn


  # State Machine Definition
# State Machine Definition
  MyStateMachine:
    Type: "AWS::StepFunctions::StateMachine"
    DependsOn:
      - CognitioUserCreateLambdaLayerFunctionNew
      - OpensearchIndexLambdaFunction
      - OpensearchRoleMappingLambdaFunction
      - StateMachineExecutionRole
    Properties:
      StateMachineName: !Sub "${AWS::AccountId}-carl-state-machine"
      RoleArn: !GetAtt StateMachineExecutionRole.Arn
      DefinitionString:
        Fn::Sub:
          - |
            {
              "Comment": "A state machine that invokes Lambda functions in parallel.",
              "StartAt": "ParallelExecution",
              "States": {
                "ParallelExecution": {
                  "Type": "Parallel",
                  "End": true,
                  "Branches": [
                    {
                      "StartAt": "OpensearchIndexLambdaFunction",
                      "States": {
                        "OpensearchIndexLambdaFunction": {
                          "Type": "Task",
                          "Resource": "${OpensearchIndexLambdaFunctionArn}",
                          "End": true
                        }
                      }
                    },
                    {
                      "StartAt": "CognitioUserCreateLambdaLayerFunctionNew",
                      "States": {
                        "CognitioUserCreateLambdaLayerFunctionNew": {
                          "Type": "Task",
                          "Resource": "${CognitioUserCreateLambdaLayerFunctionNewArn}",
                          "End": true
                        }
                      }
                    },
                    {
                      "StartAt": "OpensearchRoleMappingLambdaFunction",
                      "States": {
                        "OpensearchRoleMappingLambdaFunction": {
                          "Type": "Task",
                          "Resource": "${OpensearchRoleMappingLambdaFunctionArn}",
                          "End": true
                        }
                      }
                    }
                  ]
                }
              }
            }
          - OpensearchIndexLambdaFunctionArn: !GetAtt OpensearchIndexLambdaFunction.Arn
            CognitioUserCreateLambdaLayerFunctionNewArn: !GetAtt CognitioUserCreateLambdaLayerFunctionNew.Arn
            OpensearchRoleMappingLambdaFunctionArn: !GetAtt OpensearchRoleMappingLambdaFunction.Arn
      Tags:
        - Key: !Sub "${AWS::AccountId}-Name"
          Value: "opensearch-State-Machine"
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StepFunctionsLogGroup.Arn
        IncludeExecutionData: true
        Level: ALL


  CloudFormationCreateInProgressRule:
    Type: AWS::Events::Rule
    DependsOn:
      - MyStateMachine
    Properties:
      Name: CloudFormation-Create-Rule
      EventPattern: >-
        {
          "source": ["aws.cloudformation"],
          "detail-type": ["CloudFormation Resource Status Change"],
          "detail": {
            "logical-resource-id": ["OpenSearchCluster"],
            "status-details": {
              "status": ["CREATE_COMPLETE"]
            }
          }
        }
      State: ENABLED
      Targets:
        - Arn: !Sub "arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${StateMachineName}"
          RoleArn: !GetAtt EventBridgeStepFunctionInvokeRole.Arn
          Id: 'AOS-Create-CloudWatchLogGroupTarget'

  OpensearchRoleMappingLambdaFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - UnifiedLambdaExecutionRole
      - OpenSearchCluster
      - AuthUserRole
      - OpensearchPyLayer
      - RequestsAws4AuthLayer
    Properties:
      FunctionName: !Sub "CreateOpenSearchRoleMapping-${AWS::AccountId}"
      Handler: aos-role-mapping.lambda_handler
      Role: !GetAtt UnifiedLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 50
      Layers:
        - !GetAtt OpensearchPyLayer.LayerVersionArn
        - !GetAtt RequestsAws4AuthLayer.LayerVersionArn
      Environment:
        Variables:
          REGION: !Sub '${AWS::Region}'
          OPENSEARCH_ENDPOINT: !GetAtt OpenSearchCluster.DomainEndpoint
          ROLE_MAP1: !GetAtt AuthUserRole.Arn
      CodeUri: ./lambda_function/

  #IAM Role for EventBridge to invoke Step Functions
  EventBridgeStepFunctionInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::AccountId}-EventBridgeInvokeStepFunctionRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "EventBridgeInvokeStepFunctionPolicy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref MyStateMachine




  OpensearchIndexLambdaFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - UnifiedLambdaExecutionRole
      - OpenSearchCluster
      - AuthUserRole
      - OpensearchPyLayer
      - RequestsAws4AuthLayer
    Properties:
      FunctionName: !Sub "CreateOpenSearchIndex-${AWS::AccountId}"
      Handler: SurveyIndexTemplateCreator.handler
      Role: !GetAtt UnifiedLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 50
      Layers:
        - !GetAtt OpensearchPyLayer.LayerVersionArn
        - !GetAtt RequestsAws4AuthLayer.LayerVersionArn
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt OpenSearchCluster.DomainEndpoint
          AOS_AUTH_ROLE: !GetAtt AuthUserRole.Arn
          LAMBDA_REGION: !Sub '${AWS::Region}'
      CodeUri: ./lambda_function/




  CognitioUserCreateLambdaLayerFunctionNew:
    Type: AWS::Serverless::Function
    DependsOn: 
      - CognitoUserPoolNew
      - CognitioLambdaRoleNew
    Properties:
      FunctionName: !Sub "${AWS::AccountId}-Cognitio-UserCreate"
      Handler: create_cognito_user.handler
      Role: !GetAtt CognitioLambdaRoleNew.Arn
      Runtime: python3.12
      Timeout: 20
      Environment:
        Variables:
          USERNAME: "admin"
          PASSWORD: "Password123$"
          USER_POOL_ID: !Ref CognitoUserPoolNew
          STACK: !Sub "${AWS::AccountId}"
      CodeUri: ./lambda_function/

  #EventBridge Rule to trigger Step Function (commented out for now)
  # CloudFormationCreateInProgressRule:
  #   Type: AWS::Events::Rule
  #   DependsOn:
  #     - AutomationStateMachine
  #   Properties:
  #     Name: CloudFormation-Create-Rule
  #     EventPattern: >-
  #       {"detail-type":["CloudFormation Resource Status Change"],"source":["aws.cloudformation"],"detail":{"logical-resource-id":["clusterManagerInstance"],"status-details":{"status":["CREATE_COMPLETE"]}},"resources":[{"wildcard":"arn:aws:cloudformation:*:*:stack/*DataStack*/*"}]}
  #     State: ENABLED
  #     Targets:
  #       - Arn: !GetAtt AutomationStateMachine.Arn
  #         RoleArn: !ImportValue CombinedEventBridgeRoleArnExport
  #         Id: 'AOS-Create-CloudWatchLogGroupTarget'






  #=========================================================================
  # ADDITIONAL LAMBDA FUNCTIONS
  #=========================================================================
  ComprehendSentimentLambda:
    Type: AWS::Serverless::Function
    DependsOn:
      - UnifiedLambdaExecutionRole
    Properties:
      FunctionName: !Sub "ComprehendSentimentLambda-${AWS::AccountId}"
      Handler: kinesis_comprehend.lambda_handler
      Role: !GetAtt UnifiedLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 60
      CodeUri: ./lambda_function/

  #=========================================================================
  # DATA STREAM RESOURCES
  #=========================================================================
  SQSToFirehosePipe:
    Type: AWS::Pipes::Pipe
    DependsOn:
      - S3EventQueue
      - PipesExecutionRole
      - SurveyDeliveryStream
    Properties:
      Name: !Sub "SQSToFirehosePipe-${AWS::AccountId}"
      RoleArn: !GetAtt PipesExecutionRole.Arn
      Source: !GetAtt S3EventQueue.Arn
      Target: !GetAtt SurveyDeliveryStream.Arn
      SourceParameters:
        SqsQueueParameters:
          BatchSize: 10

  SurveyDeliveryStream:
    Type: "AWS::KinesisFirehose::DeliveryStream"
    DependsOn:
      - FirehoseBankRole
      - OpenSearchCluster
      - SurveyBucket
      - SurveyFirehoseLogStream
      - SurveyFirehoseLogGroup
      - SurveyFirehoseLogS3Group
      - SurveyFirehoseLogS3Stream
    Properties:
      DeliveryStreamName: !Sub "survey-data-delivery-stream-${AWS::AccountId}"
      DeliveryStreamType: DirectPut
      AmazonopensearchserviceDestinationConfiguration:
        BufferingHints: 
          IntervalInSeconds: 60
          SizeInMBs: 1
        DomainARN: !GetAtt OpenSearchCluster.Arn
        RoleARN: !GetAtt FirehoseBankRole.Arn
        RetryOptions:  
          DurationInSeconds: 0
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref SurveyFirehoseLogGroup
          LogStreamName: !Ref SurveyFirehoseLogStream
        IndexName: survey-data
        IndexRotationPeriod: 'NoRotation'
        S3BackupMode: AllDocuments
        S3Configuration:
          BucketARN: !GetAtt SurveyBucket.Arn
          RoleARN: !GetAtt FirehoseBankRole.Arn
          CompressionFormat: UNCOMPRESSED
          Prefix: error_folder
          CloudWatchLoggingOptions:
            Enabled: true
            LogGroupName: !Ref SurveyFirehoseLogS3Group
            LogStreamName: !Ref SurveyFirehoseLogS3Stream

