# Synced from coding_rules shared-workflows. Do not edit in target repos.
# Uses anthropics/claude-code-action for @claude comments and PR code review.
name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  on-comment:
    name: Respond to @claude
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Check for @claude
        id: check
        run: |
          if echo '${{ github.event.comment.body }}' | grep -q '@claude'; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4
      - name: Claude code action
        if: steps.check.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  pr-review:
    name: PR code review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are performing a code review for this pull request.
            First read all files in .cursor/rules/ (if present) to understand this project's coding standards.
            Then review the PR diff for:
            - Code quality and consistency with those standards
            - Security issues
            - Correctness and maintainability
            Post your review as PR comments where relevant.
