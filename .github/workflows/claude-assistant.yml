# Synced from coding_rules cursor/shared-workflows. Do not edit in target repos.
# Uses anthropics/claude-code-action for @claude comments and PR code review.
name: Claude Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  on-comment:
    name: Respond to @claude
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: claude-comment-${{ github.event.comment.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Claude code action
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  pr-review:
    name: PR code review
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'claude/') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are performing a code review for this pull request.
            First read all files in .cursor/rules/ (if present) to understand this project's coding standards.
            Then review the PR diff for:
            - Code quality and consistency with those standards
            - Security issues
            - Correctness and maintainability
            Post your review as PR comments where relevant.
