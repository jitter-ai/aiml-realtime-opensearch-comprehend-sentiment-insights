# Synced from coding_rules shared-workflows. Do not edit in target repos.
# Pulls latest Cursor rules, skills, commands, hooks from coding_rules and commits directly.
# Uses REPS_TOKEN (fine-grained PAT with Contents read on coding_rules).
name: Pull global rules

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: QuantumPulse42/coding_rules
      SOURCE_REF: main

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPS_TOKEN }}

      - name: Fetch rules from coding_rules
        env:
          GH_TOKEN: ${{ secrets.REPS_TOKEN }}
        run: |
          git clone --depth 1 --branch "$SOURCE_REF" \
            "https://x-access-token:${GH_TOKEN}@github.com/${SOURCE_REPO}.git" _source

      - name: Sync rules into this repo
        run: |
          mkdir -p .cursor/rules .cursor/skills .cursor/commands .cursor/agents .cursor/hooks

          rm -f .cursor/rules/*.mdc
          for f in _source/cursor-rules/*.mdc; do
            [ -f "$f" ] && cp "$f" .cursor/rules/
          done

          rm -rf .cursor/skills && mkdir -p .cursor/skills
          if [ -d _source/cursor-skills ]; then
            find _source/cursor-skills -name "SKILL.md" | while IFS= read -r f; do
              rel="${f#_source/cursor-skills/}"
              dir=".cursor/skills/$(dirname "$rel")"
              mkdir -p "$dir"
              cp "$f" ".cursor/skills/$rel"
            done
          fi

          rm -f .cursor/commands/*.md
          for f in _source/cursor-commands/*.md; do
            [ -f "$f" ] && cp "$f" .cursor/commands/
          done; true

          rm -f .cursor/agents/*.md
          for f in _source/cursor-agents/*.md; do
            [ -f "$f" ] && cp "$f" .cursor/agents/
          done; true

          rm -f .cursor/hooks/*.yml
          for f in _source/cursor-hooks/*.yml; do
            [ -f "$f" ] && cp "$f" .cursor/hooks/
          done; true

          rm -rf _source

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .cursor/
          if git diff --staged --quiet; then
            echo "No rule changes to commit."
          else
            git commit -m "chore: pull latest global rules from coding_rules"
            git push
          fi
