# Sync sanitized deploy/ content to jitter-ai public org.
#
# Placed here by gh-bootstrap and pushed to all QuantumPulse42 repos by
# scripts/deploy.py.  Each repo that carries a deploy/ folder gets its
# contents mirrored (full-replace) into the matching jitter-ai repo.
#
# Required secret: PUBLIC_ORG_PAT  (repo-scoped PAT for jitter-ai)

name: Sync to Public Org

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if scanner reports warnings"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_ORG: QuantumPulse42
  TARGET_ORG: jitter-ai
  SCANNER_IMAGE: ghcr.io/quantumpulse42/container-images/github-utils:latest
  GIT_AUTHOR_NAME: "github-actions[bot]"
  GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
  GIT_COMMITTER_NAME: "github-actions[bot]"
  GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"

jobs:
  sync:
    name: Sync deploy/ to jitter-ai
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source repo ────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify deploy/ exists
        run: |
          if [ ! -d deploy ]; then
            echo "::warning::No deploy/ directory found — nothing to sync."
            echo "SKIP_SYNC=true" >> "$GITHUB_ENV"
          fi

      # ── 2. Read optional config ────────────────────────────────────
      - name: Read deploy/config.yml
        if: env.SKIP_SYNC != 'true'
        id: config
        run: |
          CONFIG_FILE="deploy/config.yml"
          TARGET_REPO="${{ github.event.repository.name }}"
          EXCLUDE_PATTERNS=""

          if [ -f "$CONFIG_FILE" ]; then
            # Extract target_repo (ignore commented lines)
            CFG_TARGET=$(grep -E '^\s*target_repo\s*:' "$CONFIG_FILE" | head -1 | sed 's/.*:\s*//' | tr -d '"' | tr -d "'" | xargs)
            if [ -n "$CFG_TARGET" ]; then
              TARGET_REPO="$CFG_TARGET"
            fi

            # Extract exclude_patterns as newline-delimited list
            EXCLUDE_PATTERNS=$(python3 -c "
          import yaml, sys, pathlib
          cfg = yaml.safe_load(pathlib.Path('$CONFIG_FILE').read_text()) or {}
          for p in cfg.get('exclude_patterns', []):
              print(p)
          " 2>/dev/null || true)
          fi

          echo "target_repo=$TARGET_REPO" >> "$GITHUB_OUTPUT"
          {
            echo "exclude_patterns<<PATTERNS_EOF"
            echo "$EXCLUDE_PATTERNS"
            echo "PATTERNS_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Target repo: $TARGET_REPO"

      # ── 3. Build sanitized staging tree ────────────────────────────
      - name: Stage and sanitize deploy/ content
        if: env.SKIP_SYNC != 'true'
        id: stage
        run: |
          STAGING_DIR="$(mktemp -d)"
          echo "staging_dir=$STAGING_DIR" >> "$GITHUB_OUTPUT"

          # Copy deploy/ contents (not the folder itself) into staging
          cp -a deploy/. "$STAGING_DIR/"

          # Remove config.yml from staging — it is metadata, not publishable
          rm -f "$STAGING_DIR/config.yml"

          # Remove workflows/ subfolder — these are deployer payloads, not public content
          rm -rf "$STAGING_DIR/workflows"

          # ── Apply .gitignore exclusions from source repo ──
          if [ -f .gitignore ]; then
            while IFS= read -r pattern; do
              pattern="$(echo "$pattern" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
              [ -z "$pattern" ] && continue
              [[ "$pattern" == \#* ]] && continue
              cd "$STAGING_DIR"
              # Use find + shell glob to remove matching entries
              find . -name "$pattern" -exec rm -rf {} + 2>/dev/null || true
              cd - > /dev/null
            done < .gitignore
          fi

          # ── Apply exclude_patterns from config ──
          EXCLUDE_PATTERNS='${{ steps.config.outputs.exclude_patterns }}'
          if [ -n "$EXCLUDE_PATTERNS" ]; then
            echo "$EXCLUDE_PATTERNS" | while IFS= read -r pattern; do
              pattern="$(echo "$pattern" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
              [ -z "$pattern" ] && continue
              cd "$STAGING_DIR"
              find . -path "./$pattern" -exec rm -rf {} + 2>/dev/null || true
              find . -name "$pattern" -exec rm -rf {} + 2>/dev/null || true
              cd - > /dev/null
            done
          fi

          # ── Hard-block sensitive file patterns ──
          cd "$STAGING_DIR"
          BLOCKED_PATTERNS=(
            "*.env"
            ".env.*"
            "*.pem"
            "*.key"
            "*secret*"
          )
          BLOCKED_FOUND=0
          for bp in "${BLOCKED_PATTERNS[@]}"; do
            while IFS= read -r -d '' match; do
              echo "::error::Blocked file pattern '$bp' matched: $match"
              BLOCKED_FOUND=1
            done < <(find . -name "$bp" -print0 2>/dev/null)
          done
          cd - > /dev/null

          if [ "$BLOCKED_FOUND" -eq 1 ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

          # Count files for later verification
          FILE_COUNT=$(find "$STAGING_DIR" -type f | wc -l)
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
          echo "Staged $FILE_COUNT file(s)"

      - name: Fail on blocked file patterns
        if: env.SKIP_SYNC != 'true' && steps.stage.outputs.blocked == 'true'
        run: |
          echo "::error::Blocked sensitive file patterns detected in deploy/. Aborting sync."
          exit 1

      # ── 4. Scan for secrets and sensitive content ──────────────────
      - name: Scan staging with container scanner
        if: env.SKIP_SYNC != 'true'
        id: scan
        run: |
          STAGING_DIR="${{ steps.stage.outputs.staging_dir }}"
          SCAN_EXIT=0

          # Regex patterns for content scanning
          declare -A CONTENT_PATTERNS
          CONTENT_PATTERNS=(
            ["1Password_op_uri"]='op://[^\s"'"'"']+'
            ["1Password_env_token"]='OP_SERVICE_ACCOUNT_TOKEN|OP_CONNECT_TOKEN'
            ["AWS_account_id"]='[0-9]{12}'
            ["AWS_ARN"]='arn:aws:[a-zA-Z0-9\-]+:[a-z0-9\-]*:[0-9]{12}:'
            ["hardcoded_IP"]='[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
          )

          echo "=== Content scan ==="
          for label in "${!CONTENT_PATTERNS[@]}"; do
            PATTERN="${CONTENT_PATTERNS[$label]}"
            MATCHES=$(grep -rEn "$PATTERN" "$STAGING_DIR" 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              # Filter out false positives for IPs (allow 0.0.0.0, 127.0.0.1, common semver-like)
              if [ "$label" = "hardcoded_IP" ]; then
                MATCHES=$(echo "$MATCHES" | grep -vE '0\.0\.0\.0|127\.0\.0\.1|255\.255\.255\.(0|255)|::1' || true)
                # Filter version-like patterns (x.y.z where segments < 256 in context of semver)
                MATCHES=$(echo "$MATCHES" | grep -vE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+ ' || true)
              fi
              # Filter out the AWS account ID pattern being too greedy (12-digit numbers in non-AWS context)
              if [ "$label" = "AWS_account_id" ]; then
                MATCHES=$(echo "$MATCHES" | grep -iE 'aws|account|arn|role|policy' || true)
              fi
              if [ -n "$MATCHES" ]; then
                echo "::error::Scanner [$label] found potential sensitive content:"
                echo "$MATCHES" | head -20
                SCAN_EXIT=1
              fi
            fi
          done

          # Try container-based scanner for deeper analysis
          echo "=== Container scanner ==="
          if docker pull "$SCANNER_IMAGE" > /dev/null 2>&1; then
            CONTAINER_RESULT=$(docker run --rm \
              -v "$STAGING_DIR:/scan:ro" \
              "$SCANNER_IMAGE" \
              trufflehog filesystem /scan --json --only-verified 2>/dev/null || true)
            if [ -n "$CONTAINER_RESULT" ] && [ "$CONTAINER_RESULT" != "null" ]; then
              VERIFIED_COUNT=$(echo "$CONTAINER_RESULT" | grep -c '"Verified":true' || true)
              if [ "$VERIFIED_COUNT" -gt 0 ]; then
                echo "::error::TruffleHog found $VERIFIED_COUNT verified secret(s)"
                echo "$CONTAINER_RESULT" | head -50
                SCAN_EXIT=1
              fi
            fi
            echo "Container scan complete"
          else
            echo "::warning::Container image not available; relying on regex scan only"
          fi

          if [ "$SCAN_EXIT" -ne 0 ]; then
            FORCE="${{ inputs.force }}"
            if [ "$FORCE" = "true" ]; then
              echo "::warning::Scan failures detected but force=true — continuing"
              echo "scan_passed=true" >> "$GITHUB_OUTPUT"
            else
              echo "scan_passed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Scan passed — no sensitive content detected"
            echo "scan_passed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on scan findings
        if: env.SKIP_SYNC != 'true' && steps.scan.outputs.scan_passed == 'false'
        run: |
          echo "::error::Scanner found sensitive content that could not be auto-stripped. Review findings above."
          exit 1

      # ── 5. Resolve target repo and check existence ─────────────────
      - name: Check target repo exists
        if: env.SKIP_SYNC != 'true'
        id: target
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_ORG_PAT }}
        run: |
          TARGET_REPO="${{ steps.config.outputs.target_repo }}"
          echo "Checking ${TARGET_ORG}/${TARGET_REPO}..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${TARGET_ORG}/${TARGET_REPO}")

          if [ "$HTTP_CODE" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Target repo exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Target repo ${TARGET_ORG}/${TARGET_REPO} does not exist (HTTP $HTTP_CODE) — skipping sync."
          fi

      # ── 6. Clone target, mirror, commit, push ─────────────────────
      - name: Mirror to target repo
        if: env.SKIP_SYNC != 'true' && steps.target.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_ORG_PAT }}
        run: |
          TARGET_REPO="${{ steps.config.outputs.target_repo }}"
          STAGING_DIR="${{ steps.stage.outputs.staging_dir }}"
          SOURCE_REPO="${{ github.event.repository.name }}"
          CLONE_DIR="$(mktemp -d)"

          echo "=== Cloning ${TARGET_ORG}/${TARGET_REPO} ==="
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_ORG}/${TARGET_REPO}.git" \
            "$CLONE_DIR"

          echo "=== Wiping target contents ==="
          # Remove everything except .git
          find "$CLONE_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          echo "=== Copying sanitized content ==="
          cp -a "$STAGING_DIR"/. "$CLONE_DIR/"

          echo "=== Checking for changes ==="
          cd "$CLONE_DIR"
          git add -A

          if git diff --cached --quiet; then
            echo "::notice::No changes detected — target already matches deploy/ content."
            exit 0
          fi

          echo "=== Committing and pushing ==="
          git commit -m "chore: sync from ${SOURCE_ORG}/${SOURCE_REPO}"
          git push origin main

          echo "Sync complete: ${SOURCE_ORG}/${SOURCE_REPO} -> ${TARGET_ORG}/${TARGET_REPO}"

      - name: Clean up staging
        if: always()
        run: |
          if [ -n "${{ steps.stage.outputs.staging_dir }}" ]; then
            rm -rf "${{ steps.stage.outputs.staging_dir }}" || true
          fi
